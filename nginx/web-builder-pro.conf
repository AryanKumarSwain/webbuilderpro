# ═════════════════════════════════════════════════════════════════
# Web Builder Pro - Nginx Reverse Proxy & Static Host Configuration
# Place in: /etc/nginx/sites-available/web-builder-pro
# Symlink:  sudo ln -s /etc/nginx/sites-available/web-builder-pro /etc/nginx/sites-enabled/
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx
# ═════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;

    # Replace with your actual domain and wildcard for school subdomains / custom domains
    # e.g.: server_name yourdomain.com *.yourdomain.com;
    server_name _;

    # Maximum upload size for photos, videos, and prospectus PDFs (must match/exceed Express cap)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml;

    # ── Frontend Static SPA Build ────────────────────────────────
    # Adjust path if your project is in a different directory on your VPS
    root /var/www/web-builder-pro/frontend/dist;
    index index.html;

    # Static Assets Caching (Vite hashed bundles)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Backend API Reverse Proxy ────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # ── Single Page Application (SPA) Fallback ───────────────────
    # Any route not matching a static file is forwarded to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
