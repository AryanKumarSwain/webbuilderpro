services:
  mysql:
    image: mysql:8.0
    container_name: web-builder-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-db_school_saas}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/vps_full_db_dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - saas_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: web-builder-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-rootpassword}
      - DB_NAME=${DB_NAME:-db_school_saas}
      - DB_PORT=3306
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
    depends_on:
      - mysql
    networks:
      - saas_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web-builder-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - saas_net

volumes:
  mysql_data:

networks:
  saas_net:
    driver: bridge
